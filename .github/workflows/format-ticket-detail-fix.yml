name: Format ticket detail overflow fix

on:
  push:
    branches:
      - refactor/phase-8-ui-nfr
    paths:
      - .github/workflows/format-ticket-detail-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refactor/phase-8-ui-nfr
          fetch-depth: 0

      - name: Set up Flutter stable formatter
        shell: bash
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Format changed Dart files
        shell: bash
        run: |
          dart format \
            lib/features/ticket/presentation/pages/ticket_detail_page.dart \
            lib/features/ticket/presentation/widgets/ticket_detail_skeleton.dart \
            test/features/ticket/presentation/widgets/ticket_detail_skeleton_test.dart
          rm .github/workflows/format-ticket-detail-fix.yml

      - name: Commit formatting and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/ticket/presentation/pages/ticket_detail_page.dart \
            lib/features/ticket/presentation/widgets/ticket_detail_skeleton.dart \
            test/features/ticket/presentation/widgets/ticket_detail_skeleton_test.dart \
            .github/workflows/format-ticket-detail-fix.yml
          git commit -m "style(ui): format ticket detail overflow fix"
          git push origin HEAD:refactor/phase-8-ui-nfr

name: Generate TICKET-Q App Icons

on:
  push:
    branches:
      - fix/app-icon-branding
    paths:
      - assets/icons/app_icon.png
      - pubspec.yaml
      - .github/workflows/generate-app-icons.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: fix/app-icon-branding
          fetch-depth: 0

      - name: Set up Flutter
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Validate and normalize source icon
        run: |
          test -f assets/icons/app_icon.png
          file assets/icons/app_icon.png
          identify assets/icons/app_icon.png
          convert assets/icons/app_icon.png \
            -resize 1024x1024! \
            -background '#0B1220' \
            -alpha remove \
            -alpha off \
            assets/icons/app_icon.png
          test "$(identify -format '%wx%h' assets/icons/app_icon.png)" = "1024x1024"

      - name: Align launcher icon configuration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('pubspec.yaml')
          text = path.read_text(encoding='utf-8')
          start = text.index('flutter_launcher_icons:\n')
          end = text.index('\n# For information on the generic Dart part', start)
          replacement = '''flutter_launcher_icons:
            android: true
            ios: true
            image_path: "assets/icons/app_icon.png"
            min_sdk_android: 21
            remove_alpha_ios: true
          '''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Android and iOS launcher icons
        run: dart run flutter_launcher_icons

      - name: Verify generated icon assets
        run: |
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -f ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png
          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          git diff --check

      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            assets/icons/app_icon.png \
            pubspec.yaml \
            pubspec.lock \
            android/app/src/main/res \
            ios/Runner/Assets.xcassets/AppIcon.appiconset
          if git diff --cached --quiet; then
            echo "Launcher icons are already up to date."
            exit 0
          fi
          git commit -m "fix(branding): generate TICKET-Q launcher icons"
          git push origin HEAD:fix/app-icon-branding

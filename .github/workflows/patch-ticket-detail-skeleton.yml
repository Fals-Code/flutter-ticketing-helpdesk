name: Apply ticket detail skeleton patch

on:
  push:
    branches:
      - refactor/phase-8-ui-nfr
    paths:
      - .github/workflows/patch-ticket-detail-skeleton.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refactor/phase-8-ui-nfr
          fetch-depth: 0

      - name: Integrate responsive skeleton
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page_path = Path('lib/features/ticket/presentation/pages/ticket_detail_page.dart')
          workflow_path = Path('.github/workflows/patch-ticket-detail-skeleton.yml')
          source = page_path.read_text(encoding='utf-8')

          import_anchor = (
              "import 'package:uts/features/ticket/presentation/widgets/"
              "rating_dialog.dart';\n"
          )
          skeleton_import = (
              "import 'package:uts/features/ticket/presentation/widgets/"
              "ticket_detail_skeleton.dart';\n"
          )

          if skeleton_import not in source:
              if import_anchor not in source:
                  raise SystemExit('rating_dialog import anchor was not found')
              source = source.replace(
                  import_anchor,
                  import_anchor + skeleton_import,
                  1,
              )

          method_start = source.find('  Widget _buildSkeleton(bool isDark) {')
          section_marker = source.find(
              '\n}\n\n// ── PRIVATE REUSABLE WIDGETS',
              method_start,
          )
          if method_start < 0 or section_marker < 0:
              raise SystemExit('ticket detail skeleton method markers were not found')

          replacement = (
              '  Widget _buildSkeleton(bool isDark) {\n'
              '    return TicketDetailSkeleton(isDark: isDark);\n'
              '  }\n'
          )
          source = source[:method_start] + replacement + source[section_marker:]
          page_path.write_text(source, encoding='utf-8', newline='\n')

          if workflow_path.exists():
              workflow_path.unlink()
          PY

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/ticket/presentation/pages/ticket_detail_page.dart \
            .github/workflows/patch-ticket-detail-skeleton.yml
          git commit -m "fix(ui): prevent ticket detail skeleton overflow"
          git push origin HEAD:refactor/phase-8-ui-nfr

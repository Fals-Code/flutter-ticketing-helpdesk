name: Phase 0 Validation

on:
  push:
    branches:
      - fix/phase-0-restore-helpdesk-entrypoint
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter clean
        run: flutter clean

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Release smoke build
        run: >-
          flutter build apk --release
          --dart-define=SUPABASE_URL=https://phase-0-validation.supabase.co
          --dart-define=SUPABASE_ANON_KEY=phase-0-validation-key

      - name: Verify APK location
        run: test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase-0-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

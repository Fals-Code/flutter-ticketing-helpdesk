name: Phase 0 one-time layout hotfix

on:
  push:
    branches:
      - fix/phase-0-restore-helpdesk-entrypoint
    paths:
      - .github/workflows/phase0-layout-hotfix.yml

permissions:
  contents: write

jobs:
  patch-ticket-list-layout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout phase branch
        uses: actions/checkout@v4
        with:
          ref: fix/phase-0-restore-helpdesk-entrypoint
          fetch-depth: 0

      - name: Patch responsive filter bar height
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/features/ticket/presentation/pages/ticket_list_page.dart')
          text = path.read_text(encoding='utf-8')

          old_height = 'preferredSize: const Size.fromHeight(108),'
          new_height = '''preferredSize: Size.fromHeight(
                            isTechnician && listState.assignedToId != null
                                ? 148
                                : 108,
                          ),'''
          if text.count(old_height) != 1:
              raise SystemExit('Expected exactly one filter bar preferred height')
          text = text.replace(old_height, new_height, 1)

          old_column = '''child: Column(
        children: [
          Row('''
          new_column = '''child: Column(
        mainAxisSize: MainAxisSize.min,
        children: [
          Row('''
          if text.count(old_column) != 1:
              raise SystemExit('Expected exactly one filter bar column')
          text = text.replace(old_column, new_column, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit layout patch and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/phase0-layout-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/ticket/presentation/pages/ticket_list_page.dart .github/workflows/phase0-layout-hotfix.yml
          git commit -m "fix(phase-0): prevent ticket list filter overflow"
          git push origin HEAD:fix/phase-0-restore-helpdesk-entrypoint

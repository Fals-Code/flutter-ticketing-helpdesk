name: Restore focused ticket detail page diff

on:
  push:
    branches:
      - refactor/phase-8-ui-nfr
    paths:
      - .github/workflows/restore-ticket-detail-page-format.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refactor/phase-8-ui-nfr
          fetch-depth: 0

      - name: Restore focused page formatting
        shell: bash
        run: |
          git checkout 9a9ed3348aa5ffd6411652ca9bcdfd71da12e06e -- \
            lib/features/ticket/presentation/pages/ticket_detail_page.dart
          python3 - <<'PY'
          from pathlib import Path

          page = Path('lib/features/ticket/presentation/pages/ticket_detail_page.dart')
          source = page.read_text(encoding='utf-8')
          source = source.replace(
              '  Widget _buildSkeleton(bool isDark) {\n'
              '    return TicketDetailSkeleton(isDark: isDark);\n'
              '  }\n\n}\n',
              '  Widget _buildSkeleton(bool isDark) {\n'
              '    return TicketDetailSkeleton(isDark: isDark);\n'
              '  }\n}\n',
              1,
          )
          page.write_text(source, encoding='utf-8', newline='\n')
          Path('.github/workflows/restore-ticket-detail-page-format.yml').unlink()
          PY

      - name: Commit focused formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/ticket/presentation/pages/ticket_detail_page.dart \
            .github/workflows/restore-ticket-detail-page-format.yml
          git commit -m "style(ui): keep ticket detail page diff focused"
          git push origin HEAD:refactor/phase-8-ui-nfr

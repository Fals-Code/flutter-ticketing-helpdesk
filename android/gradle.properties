org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# The project is on drive D: while the pub cache is on drive C: on Windows.
# Kotlin incremental cache path relocation fails across those roots, so use a
# deterministic in-process, non-incremental compiler strategy for Android builds.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.useFallbackStrategy=true
android.suppressUnsupportedCompileSdk=36
